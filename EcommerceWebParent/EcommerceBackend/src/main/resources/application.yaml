spring:
  application:
    name: ${APP_NAME:Ecommerce Admin App}
  datasource:
    url: jdbc:${DB_postgresql}://${DB_SERVER:localhost}:${DB_PORT:5432}/${DB_NAME:ecommercedb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:jp}
  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

server:
  port: ${APP_SERVER_PORT:8080}
  servlet:
    context-path: ${ADMIN_BASE_PATH:/admin}
