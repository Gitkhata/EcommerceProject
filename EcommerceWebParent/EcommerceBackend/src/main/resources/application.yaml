spring.application.name=${APP_NAME:Ecommerce Admin App}

server.port=${APP_SERVER_PORT:8080}
server.servlet.context-path=/admin


# PostgreSQL Datasource Configuration

spring.datasource.url=jdbc:postgresql://${DB_SERVER:localhost}:${DB_PORT:5432}/${DB_NAME:ecommercedb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:jp}

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Specify the PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
